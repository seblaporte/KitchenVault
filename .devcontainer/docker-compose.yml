services:
  app:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    environment:
      OVH_AI_ENDPOINTS_ACCESS_TOKEN: ${OVH_AI_ENDPOINTS_ACCESS_TOKEN:-}
      COOKIDOO_EMAIL: ${COOKIDOO_EMAIL:-}
      COOKIDOO_PASSWORD: ${COOKIDOO_PASSWORD:-}
      COOKIDOO_COUNTRY_CODE: ${COOKIDOO_COUNTRY_CODE:-fr}
      COOKIDOO_LANGUAGE: ${COOKIDOO_LANGUAGE:-fr-FR}
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      cookidoo-service:
        condition: service_healthy
